<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schul-Timer</title>
<style>
:root{--bg:#1f3a33;--panel:#2a4a41;--chalk:#f3f1e7;--dim:#a9bdb3;--yellow:#f2cf5b;--red:#e8745f;--line:#4d6f63}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--chalk);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:1.5rem;transition:background .4s}
body.warn{--bg:#4a3d1c}
body.done{--bg:#5a2a24}
h1{margin:0;font-size:1.1rem;font-weight:500;color:var(--dim);letter-spacing:.02em}
.ring{position:relative;width:min(78vw,52vh,420px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.track{stroke:var(--line)}
.bar{stroke:var(--yellow);transition:stroke .4s}
.warn .bar{stroke:#f0a14a}
.done .bar{stroke:var(--red)}
#time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(17vw,12vh,96px);font-weight:300;font-variant-numeric:tabular-nums;font-family:"Courier New",ui-monospace,monospace}
.done #time{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
button{font:inherit;color:var(--chalk);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:.6rem 1.1rem;cursor:pointer}
button:hover{border-color:var(--chalk)}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button.main{background:var(--yellow);color:#2b2a14;border-color:var(--yellow);font-weight:600;min-width:8rem;font-size:1.1rem}
button.on{border-color:var(--yellow);color:var(--yellow)}
.custom{display:flex;align-items:center;gap:.4rem;color:var(--dim)}
input{width:4.2rem;font:inherit;text-align:center;color:var(--chalk);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:.55rem .3rem}
body.full .tools{display:none}
@media (prefers-reduced-motion:reduce){.done #time{animation:none}}
</style>
</head>
<body>
<h1 id="label">Wie lange soll der Timer laufen?</h1>

<div class="ring">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle class="track" cx="50" cy="50" r="46"/>
    <circle class="bar" id="bar" cx="50" cy="50" r="46"/>
  </svg>
  <div id="time" role="timer" aria-live="off">05:00</div>
</div>

<div class="row">
  <button class="main" id="go">Start</button>
  <button id="reset">Zurücksetzen</button>
  <button id="plus">+1 Min</button>
  <button id="fs">Vollbild</button>
</div>

<div class="tools" style="display:contents">
  <div class="row" id="presets">
    <button data-m="1">1 Min</button>
    <button data-m="3">3 Min</button>
    <button data-m="5">5 Min</button>
    <button data-m="10">10 Min</button>
    <button data-m="15">15 Min</button>
    <button data-m="20">20 Min</button>
    <button data-m="45">45 Min</button>
  </div>
  <div class="custom">
    <label for="m">Eigene Zeit:</label>
    <input id="m" type="number" min="0" max="999" value="5" inputmode="numeric"> Min
    <input id="s" type="number" min="0" max="59" value="0" inputmode="numeric"> Sek
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 46;
const bar = $('bar');
bar.style.strokeDasharray = C;

let total = 300;        // Gesamtdauer in Sekunden
let left = 300000;      // Restzeit in ms
let endAt = 0, tick = null, running = false;

function fmt(ms){
  const s = Math.ceil(ms / 1000);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (h ? h + ':' : '') + p(m) + ':' + p(r);
}

function draw(){
  $('time').textContent = fmt(left);
  document.title = (running ? fmt(left) + ' – ' : '') + 'Schul-Timer';
  bar.style.strokeDashoffset = C * (1 - Math.max(0, left) / (total * 1000));
  const finished = left <= 0 && total > 0;
  document.body.classList.toggle('done', finished);
  document.body.classList.toggle('warn', !finished && left <= Math.min(60000, total * 1000 * 0.2));
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .45, .9].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.4, ctx.currentTime + t + .03);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .35);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .4);
    });
  }catch(e){}
}

function loop(){
  left = endAt - Date.now();
  if (left <= 0){
    left = 0; stop(); draw(); beep();
    $('label').textContent = 'Zeit ist um!';
    return;
  }
  draw();
}

function start(){
  if (left <= 0) left = total * 1000;
  endAt = Date.now() + left;
  running = true;
  tick = setInterval(loop, 200);
  $('go').textContent = 'Pause';
  $('label').textContent = 'Der Timer läuft';
  loop();
}
function stop(){
  clearInterval(tick); running = false;
  $('go').textContent = 'Start';
}
function setTime(sec){
  stop();
  total = Math.max(1, sec); left = total * 1000;
  $('label').textContent = 'Bereit';
  draw();
}

$('go').onclick = () => running ? (stop(), $('label').textContent = 'Pausiert', draw()) : start();
$('reset').onclick = () => setTime(total);
$('plus').onclick = () => {
  total += 60; left += 60000;
  if (running) endAt += 60000;
  draw();
};
$('fs').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
};
document.addEventListener('fullscreenchange', () =>
  document.body.classList.toggle('full', !!document.fullscreenElement));

document.querySelectorAll('#presets button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#presets button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  $('m').value = b.dataset.m; $('s').value = 0;
  setTime(b.dataset.m * 60);
});
['m','s'].forEach(id => $(id).oninput = () => {
  document.querySelectorAll('#presets button').forEach(x => x.classList.remove('on'));
  setTime((+$('m').value || 0) * 60 + (+$('s').value || 0));
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); $('go').click(); }
  if (e.key === 'r') $('reset').click();
  if (e.key === 'f') $('fs').click();
});

draw();
</script>
</body>
</html>
